name: OpsPilot maintenance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  APP: RallTheoryGroup/src/products/opspilot/src
defaults:
  run:
    working-directory: RallTheoryGroup/src/products/opspilot/src
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: RallTheoryGroup/src/products/opspilot/src/package-lock.json
      - run: npm ci
      - name: Create runtime package
        run: |
          mkdir -p dist
          cp index.js package.json package-lock.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: opspilot-candidate
          path: RallTheoryGroup/src/products/opspilot/src/dist/
          if-no-files-found: error
          retention-days: 7
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: RallTheoryGroup/src/products/opspilot/src/package-lock.json
      - run: npm ci
      - run: |
          mkdir -p test-results
          npm test -- --ci --json --outputFile=test-results/jest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opspilot-test-evidence
          path: RallTheoryGroup/src/products/opspilot/src/test-results/
          if-no-files-found: error
          retention-days: 7
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  ready:
    runs-on: ubuntu-latest
    needs: [package, test, syntax]
    steps:
      - run: echo "Candidate passed package, test, and syntax jobs"
        working-directory: .
